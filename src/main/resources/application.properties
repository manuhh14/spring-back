spring.application.name=webAvanzada
server.port=${SERVER_PORT:8080}

# Variables locales (credenciales) en .env, que no se sube al repositorio. Ver .env.example
spring.config.import=optional:file:.env[.properties]

# Conexion con PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/residencias-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (la clave debe tener al menos 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:480}

# Administrador inicial (se crea al arrancar si no existe ningun ADMIN)
app.admin.correo=${ADMIN_CORREO:admin@residencias.com}
app.admin.password=${ADMIN_PASSWORD}

# Subida de archivos
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS: origenes del frontend separados por coma
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:5173,http://localhost:3000}

# Microservicio de recomendaciones (FastAPI). La clave debe ser la misma que su variable API_KEY
app.recomendaciones.url=${RECOMENDACIONES_URL:http://localhost:8081}
app.recomendaciones.api-key=${RECOMENDACIONES_API_KEY:}
app.recomendaciones.timeout-segundos=${RECOMENDACIONES_TIMEOUT_SEGUNDOS:5}

# Swagger UI en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
