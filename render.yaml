services:
  - type: web
    name: residencias-api
    runtime: docker
    plan: free
    healthCheckPath: /v3/api-docs
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_CORREO
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGENES
        sync: false
      - key: RECOMENDACIONES_URL
        sync: false
      - key: RECOMENDACIONES_API_KEY
        sync: false
      # El microservicio también se duerme en el plan gratuito y tarda en despertar
      - key: RECOMENDACIONES_TIMEOUT_SEGUNDOS
        value: "60"
      # Render termina HTTPS en su proxy; sin esto Swagger genera URLs http://
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
